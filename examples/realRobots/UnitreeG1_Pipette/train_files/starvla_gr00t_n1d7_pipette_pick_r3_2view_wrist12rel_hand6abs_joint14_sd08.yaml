# GR00T-N1.7 PIPETTE PICK, ROUND 3 (2026-09-29): round 2 ("hands ABSOLUTE,
# wrists chunk-relative") PLUS the ABSOLUTE arm joint angles as a second
# output, which the bridge uses to WARM-START its IK.
#
# ONE CHANGE vs round 2: 14 more action dims (DataConfig
# unitree_g1_pipette_2view_wrist12rel_hand6abs_joint14) -- action[15:22] /
# action[22:29], the commanded L/R arm joints in radians, absolute labels and
# statistics (not in action_mode_apply_keys). Everything else is round 2's:
# data, split, 59-dim state, views, pause filter, model, state dropout 0.8,
# optimiser, schedule, holdout.
#
# THE TWO OUTPUTS AGREE BY CONSTRUCTION: action.{L,R}_wrist_pose6 ==
# FK(action[:29]) on all 63 step-1 episodes (<= 2e-8 m / 6e-8 rad), so a
# perfect joint row seeds the IK exactly at the wrist target. What the joints
# add is the elbow swivel, the one direction the 6-D wrist pose leaves free.
#
# NOT COMPARABLE to round 2 on the aggregate mse / mse_ratio (32 dims instead
# of 18, and the flow-matching loss is now shared with the joints). Dims 0..17
# carry round 2's labels under round 2's statistics: compare the logged
# per-dim rmse_dim{0..17} in physical units; dims 18..31 are joint radians.
#
# SERVING: round 2's lane with each IK row seeded from the joint head.
#
run_id: starvla_gr00t_n1d7_pipette_pick_r3_2view_wrist12rel_hand6abs_joint14_sd08
run_root_dir: outputs/starvla
seed: 42
wandb_entity: jren313-georgia-institute-of-technology
wandb_project: starVLA_unitree_g1_pipette
is_debug: false
version_id: "0.1"
framework:
  name: CosmosGR00TN1d7
  # N1.7 checkpoint dir (contains model-*.safetensors). Leave null to auto-find
  # the snapshot in the HF cache (models--nvidia--GR00T-N1.7-3B).
  pretrained_gr00t_n1d7: null
  # 25 = unitree_g1_full_body_with_waist_height_nav_cmd, as the round-10 twin:
  # the slot only selects which pretrained projector rows warm-start.
  embodiment_id: 25
  tune_llm: true
  tune_visual: true
  enable_gradient_checkpointing: true
  qwenvl:
    base_vlm: nvidia/Cosmos-Reason2-2B
    attn_implementation: sdpa
    select_layer: 16
  action_model:
    # 32 = round 2's 18 (L/R wrist rel6 + L thumb_bend + R pinky..thumb_bend)
    # + L/R arm joints 7 + 7, absolute (see the DataConfig); 59 = 29 joints +
    # measured and commanded L/R wrist pose6 + commanded L hand1 / R hand5.
    action_dim: 32
    state_dim: 59
    action_horizon: 30
    # --- everything below matches nvidia/GR00T-N1.7-3B config.json and MUST NOT
    #     change if you want the pretrained head to keep loading 1:1 ---
    max_action_dim: 132
    max_state_dim: 132
    # ONE state frame; MUST match the DataConfig's state_indices [0].
    state_history_length: 1
    max_num_embodiments: 32
    backbone_embedding_dim: 2048
    input_embedding_dim: 1536
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    use_vlln: true
    use_alternate_vl_dit: true
    attend_text_every_n_blocks: 2
    num_inference_timesteps: 4
    num_timestep_buckets: 1000
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    # The round-10 twin's value: the 59-dim state is zeroed on 80% of
    # samples, so the head has to read the cameras, hand targets included.
    state_dropout_prob: 0.8
    # 1.0 == press-frame weighting DISABLED (the dim/thresh below are inert;
    # dim 18 is now the left shoulder pitch, which nothing weights).
    grasp_loss_weight: 1.0
    grasp_weight_dim: 18
    grasp_weight_thresh: 0.04
    diffusion_model_cfg:
      num_attention_heads: 32
      attention_head_dim: 48
      output_dim: 1024
      num_layers: 32
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
    vl_self_attention_cfg:
      num_attention_heads: 32
      attention_head_dim: 64
      num_layers: 4
      dropout: 0.2
      final_dropout: true
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /home/jren313/Datasets
    data_mix: unitree_g1_pipette_2view_p1_wrist12rel_hand6abs_joint14_train_mix
    eval_data_mix: unitree_g1_pipette_2view_p1_wrist12rel_hand6abs_joint14_eval_mix
    # 4 ranks x 10 x 12 = 480 fixed holdout samples from the 9 held-out
    # step-1 episodes: indices [0, 480), round 1's and round 2's samples.
    eval_num_batches: 10
    eval_batch_size: 12
    # Repeats each sample's row 0: zero on the rel wrist dims, the current
    # hand/joint command on the absolute dims -- "hold still" for all three.
    eval_baseline: hold_first
    expected_num_views: 2
    lerobot_version: v2.0
    action_type: abs_qpos
    # rel on the WRISTS ONLY, anchored at their commanded state aliases
    # (byte-copy columns); dims [3, 6) get the exact relative rotation. The
    # hand and joint keys are left out on purpose: absolute labels AND
    # statistics.
    action_mode: rel
    action_mode_apply_keys: ["action.left_wrist_rel6", "action.right_wrist_rel6"]
    action_mode_state_map:
      action.left_wrist_rel6: state.left_wrist_cmd6
      action.right_wrist_rel6: state.right_wrist_cmd6
    action_mode_rotvec_dims:
      action.left_wrist_rel6: [3, 6]
      action.right_wrist_rel6: [3, 6]
    # 1.0 mm over the chunk on the commanded L xyz ++ R xyz. TRAIN MIXTURE ONLY.
    pause_filter_mm: 1.0
    pause_filter_key: action.both_wrist_xyz
    sequential_step_sampling: false
    # 32 x 4 GPUs (4,5,6,7), no accumulation = 128.
    per_device_batch_size: 32
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    delete_pause_frame: false
    video_backend: decord
    num_workers: 8

trainer:
  # 10 epochs at batch 128 over the 36,558 post-pause-filter train anchors:
  # 285.6 steps/epoch x 10 = 2856.
  max_train_steps: 2856
  num_warmup_steps: 100
  # Every eval point is saved too: 11 + final = 12 x 8.9 GB = ~107 GB.
  save_interval: 250
  eval_interval: 250
  learning_rate:
    base: 2.0e-05
    qwen_vl_interface: 2.0e-05
    action_head: 2.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  # Informational only — real accum comes from ACCELERATE_GRADIENT_ACCUMULATION_STEPS
  # exported by the launcher (Accelerator is built at import time). Keep in sync.
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: paged_adamw_8bit
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  save_format: pt
