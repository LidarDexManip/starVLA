# GR00T-N1.7 fine-tune for G1 + Inspire — pipette tip attach/eject.
#
# Framework CosmosGR00TN1d7 = starVLA-native reproduction of NVIDIA GR00T-N1.7
# that DIRECTLY LOADS the public nvidia/GR00T-N1.7-3B parameters:
#   - Backbone : Cosmos-Reason2-2B (Qwen3-VL), LLM truncated to select_layer=16
#   - Head     : 32-layer alternate-VL flow-matching DiT + 4-layer VL
#                self-attention + VL LayerNorm + multi-embodiment projectors.
#
# Run via run_starvla_GR00T_N1d7_pipette_train.sh (PLAIN accelerate, NO DeepSpeed).
#
# Differences from starvla_gr00t_n1d7_piston.yaml, all forced by the data (see
# examples/realRobots/UnitreeG1_Pipette/train_files/data_registry/data_config.py):
#   - action_dim 24 (not 30): action.hand_left is constant across the entire
#     dataset and would reach the head un-normalised at raw 500/1000.
#   - state_dim  17 (not 29): both hand state groups have a degenerate dim and
#     right-hand state is a per-episode constant (an episode fingerprint).
#   - action.hand_right is min_max-normalised in the DataConfig, not q99.
#   - dataset is 60 fps (piston is 50) -> a 30-step chunk is 0.5 s, not 0.6 s.

run_id: starvla_gr00t_n1d7_pipette_g1
run_root_dir: outputs/starvla
seed: 42
wandb_entity: jren313-georgia-institute-of-technology
wandb_project: starVLA_unitree_g1_pipette
is_debug: false
version_id: "0.1"

framework:
  name: CosmosGR00TN1d7
  # N1.7 checkpoint dir (contains model-*.safetensors). Leave null to auto-find
  # the snapshot in the HF cache (models--nvidia--GR00T-N1.7-3B).
  pretrained_gr00t_n1d7: null
  # 25 = unitree_g1_full_body_with_waist_height_nav_cmd. Our action layout is
  # arms | right_hand | base_height | navigate(vx,vy,yaw_rate), which is the
  # same category order, so this slot still warm-starts the projector rows.
  embodiment_id: 25
  tune_llm: true
  tune_visual: true
  enable_gradient_checkpointing: true
  qwenvl:
    base_vlm: nvidia/Cosmos-Reason2-2B
    attn_implementation: sdpa
    select_layer: 16
  action_model:
    # left_arm7 + right_arm7 + hand_right6 + root_height1 + lin_vel_xy2 +
    # yaw_rate1 = 24 action dims; waist3 + left_arm7 + right_arm7 = 17 state.
    action_dim: 24
    state_dim: 17
    action_horizon: 30   # == len(action_indices) in the DataConfig
    # --- everything below matches nvidia/GR00T-N1.7-3B config.json and MUST NOT
    #     change if you want the pretrained head to keep loading 1:1 ---
    max_action_dim: 132
    max_state_dim: 132
    state_history_length: 1
    max_num_embodiments: 32
    backbone_embedding_dim: 2048
    input_embedding_dim: 1536
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    use_vlln: true
    use_alternate_vl_dit: true
    attend_text_every_n_blocks: 2
    num_inference_timesteps: 4
    num_timestep_buckets: 1000
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    state_dropout_prob: 0.8   # state present but dropped 80% -> strong camera reliance
    # --- press-phase frame weighting (CosmosGR00T_N1d7._frame_weights) --------
    # OFF by default: get a baseline first, then decide.
    #
    # If you turn it on, the dim to watch here is 18 == action.hand_right[4] ==
    # thumb_bend, which is what presses the tip ejector. Under min_max on
    # 0..1000 the normalised value is raw/500 - 1, so rest (500) sits at 0.0 and
    # a threshold of +0.04 (raw > 520) flags 1.68% of frames — the press. That
    # is a rarer event than the piston long-horizon case (21%), so if a baseline
    # run under-presses, this is the first knob to reach for.
    #
    # Do NOT key this on the finger dims (14..17): they leave 0 in only 147 of
    # 61,609 frames dataset-wide.
    grasp_loss_weight: 1.0
    grasp_weight_dim: 18
    grasp_weight_thresh: 0.04
    diffusion_model_cfg:
      num_attention_heads: 32
      attention_head_dim: 48
      output_dim: 1024
      num_layers: 32
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
    vl_self_attention_cfg:
      num_attention_heads: 32
      attention_head_dim: 64
      num_layers: 4
      dropout: 0.2
      final_dropout: true
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    # TRUE: N1.7 is flow-matching and conditions on proprio.
    include_state: true
    data_root_dir: /home/jren313/Datasets
    data_mix: unitree_g1_pipette_n1d7
    lerobot_version: v2.0             # v2.1 layout reads fine via the v2.0 path
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 8          # micro-batch; eff. batch = 8 * accum(4) = 32
    load_all_data_for_training: true
    obs_image_size: [256, 256]        # N1.7 image_target_size
    delete_pause_frame: false
    video_backend: decord
    num_workers: 4

trainer:
  max_train_steps: 10000
  num_warmup_steps: 50
  save_interval: 1000
  eval_interval: 500
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_head: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  # Informational only — real accum comes from ACCELERATE_GRADIENT_ACCUMULATION_STEPS
  # exported by the launcher (Accelerator is built at import time). Keep in sync.
  gradient_accumulation_steps: 4
  gradient_checkpointing: true

  optimizer:
    name: paged_adamw_8bit
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  save_format: pt
