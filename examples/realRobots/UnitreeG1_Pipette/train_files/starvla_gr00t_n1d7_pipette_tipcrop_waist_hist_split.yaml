# ROUND 4 = round 3 (SPLIT + WAIST, 27-dim) + STATE HISTORY.
#
# THE PROBLEM THIS EXISTS TO FIX. Rounds 1-3 are memoryless: observation and
# state delta_indices are both [0] and the server runs --no_state, so the whole
# input is one ego frame, one tip crop and a sentence. The task is aliased
# under that input. Measured over 8 episodes / 1288 sampled frames (both model
# views, 48x48 normalised gray): a frame's nearest neighbour MORE THAN 2 s away
# is typically closer (image distance p25 0.379) than two consecutive samples
# 83 ms apart (p50 0.207), and among the closest quarter of those pairs 68%
# have OPPOSED next-chunk arm directions, median cosine -0.31. Descending onto
# the tip and rising after it look the same. The demonstrations disagree, and
# flow matching averages the disagreement into a hold. Open loop hides it
# because dataset frames advance no matter what the arm does; closed loop turns
# it into an absorbing state, which is the observed "barely moves toward the
# tip".
#
# WHY HISTORY AND NOT JUST STATE. Position alone does not disambiguate -- the
# arm is at nearly the same joint configuration going down and coming up. The
# distinguishing quantity is VELOCITY, and four frames spanning 0.6 s is the
# cheapest way to expose it. state_dim is unchanged at 17; what changes is that
# the head now sees four of them, at -0.60/-0.40/-0.20/0 s.
#
# ALSO IN THIS ROUND: a MILD VISION LAG (VisionLagJitter, 0-100 ms). The camera
# reaches the policy later than proprioception does -- Orin capture, JPEG,
# network, decode -- while training pairs them as simultaneous. Video is pinned
# at delta 0 and state/actions slide forward by a random k, which is the same
# thing as a stale frame beside current state. Kept deliberately mild: the true
# latency has never been measured (the camera wire carries no capture
# timestamp), and wide augmentation over a guess would blur the timing of a
# task whose difficulty is a few-millimetre tip.
#
# TWO DEPLOYMENT CONDITIONS TRAVEL WITH THIS CHECKPOINT. Break either and it is
# worse than round 3, because the new feature is then out of distribution while
# the vision path has been trained to lean on it:
#
#   1. SERVE WITHOUT --no_state. That flag was never a judgement that state is
#      useless; it was the only safe option while PolicyNormProcessor had no
#      apply_state and the server sent RAW radians to a head trained on
#      q99-normalised ones. apply_state exists now and gr00t_obs_adapter calls
#      it. Serving this with --no_state zero-fills every history slot.
#   2. RUN THE ROBOT AT REAL TIME: action_hz 60, not the lane"s current 30. A
#      memoryless policy is invariant to time scaling; a velocity-conditioned
#      one is not. At action_hz 30 against a 60 fps recording the arm covers
#      half the trained distance per unit wall time, so every history frame
#      arrives at half its trained magnitude. For replay also set inference_hz
#      2.5, keeping inference_hz * advance_per_call == action_hz.
#
# The bridge buffer is indexed in STATE MESSAGE ticks (~50 Hz), not dataset
# frames, so the profile spans the same 0.6 s as [-30, -20, -10, 0], not these
# numbers.
#
# COST AND WARM START. The head embeds state by flattening history into the
# projector, so state_encoder input grows 132 -> 528 and the pretrained T=1
# tensor cannot load 1:1. CosmosGR00T_N1d7._widen_state_encoder places the
# pretrained block on the NEWEST frame and zeroes the older ones, so this run
# begins numerically identical to round 3 (verified exactly: max deviation 0.0)
# and only learns what history adds. Every other head tensor still loads 1:1.
#
# SPLIT + WAIST run: 27-dim action, trained on the 49-episode TRAIN split.
#   49 train / 10 eval / episode 0 held out for bench testing (seed 1234)
#   eps 40,44,45,55 dropped: crop locked on the forearm, no rack in frame
#   Built by build_splits.py; manifest at
#   <DATA_ROOT>/g1-pipette-tip-teleop-tipcrop-split.json
# SUPERSEDES starvla_gr00t_n1d7_pipette_tipcrop_waist (round 3), which
# trained on all 64 episodes INCLUDING the four broken crops.
# The eval split is not used during training (starVLA has no validation
# loop); score it after with tools/replay_openloop_eval.py.
# GR00T-N1.7 fine-tune for G1 + Inspire — pipette tip, TWO VIEWS + WAIST.
#
# ROUND 3. Identical to starvla_gr00t_n1d7_pipette_tipcrop.yaml except that
# action.waist is back in the action space (24 -> 27 dims, waist APPENDED at
# 24:27 so round-2 dim indices stay valid).
#
# WHY: arm actions are absolute joint targets, so a waist the policy cannot
# command is a waist frozen at the ready pose while the arms replay a
# trajectory the operator performed with the torso turning. Measured
# within-episode drift from frame 0 over 20 episodes: yaw median 6.6 deg
# (worst 13.8), roll 2.4, pitch 2.2. At a 0.45 m reach 6.6 deg of yaw puts
# the hand ~52 mm off target -- and a pipette tip is a few mm. The ego camera
# is head-mounted, so a frozen waist also moves the VIEW out of distribution.
#
# Framework CosmosGR00TN1d7 = starVLA-native reproduction of NVIDIA GR00T-N1.7
# that DIRECTLY LOADS the public nvidia/GR00T-N1.7-3B parameters:
#   - Backbone : Cosmos-Reason2-2B (Qwen3-VL), LLM truncated to select_layer=16
#   - Head     : 32-layer alternate-VL flow-matching DiT + 4-layer VL
#                self-attention + VL LayerNorm + multi-embodiment projectors.
#
# Run via run_starvla_GR00T_N1d7_pipette_train.sh with
#   CONFIG_YAML=<this file> DATA_MIX=unitree_g1_pipette_tipcrop_n1d7
#
# Differences from starvla_gr00t_n1d7_pipette.yaml — the SINGLE-view recipe on
# the same task. Only the vision path and the batch/LR scale change; the action
# and state spaces are identical because the tipcrop dataset ships the source
# dataset's parquet bytes unchanged.
#
#   - data_mix -> unitree_g1_pipette_tipcrop_n1d7  (dataset dir
#     g1-pipette-tip-teleop-tipcrop, NOT g1-pipette-tip-teleop: its rgb stream
#     is re-encoded with the crop-box overlay and the two are not swappable)
#   - expected_num_views 2  (serve-time camera-count contract)
#   - per_device_batch_size 16 / accum 1  -> global batch 128 on 8 GPUs, the
#     same shape as the proven 8xB200 wristcam run
#   - LR doubled to 2e-5 / 2e-4. The single-view recipe's 1e-5 / 1e-4 was set for
#     an effective batch of 32; this run is 4x that, and sqrt-scaling a 4x batch
#     is exactly 2x. These are the values the 8xB200 wristcam run used.
#   - num_warmup_steps 100 (was 50) — a larger batch takes longer to settle.
#
# WHY THE SECOND VIEW EXISTS: the red pipette tip is 2-4 px in the 720x1280 ego
# frame and sub-pixel once that frame is resized to 224x224 — the task-critical
# information is simply absent from the tensor. video.tip_crop is a
# detector-tracked 256x256 window (~4.6x zoom) on the tip rack. See the
# DataConfig docstring for the full deploy contract; the short version is that
# the eval client must reproduce the SAME detector and ALSO draw the same green
# crop box on the ego frame, because that box is baked into the training frames.

run_id: starvla_gr00t_n1d7_pipette_tipcrop_waist_hist_split
run_root_dir: outputs/starvla
seed: 42
wandb_entity: jren313-georgia-institute-of-technology
wandb_project: starVLA_unitree_g1_pipette
is_debug: false
version_id: "0.1"

framework:
  name: CosmosGR00TN1d7
  # N1.7 checkpoint dir (contains model-*.safetensors). Leave null to auto-find
  # the snapshot in the HF cache (models--nvidia--GR00T-N1.7-3B).
  pretrained_gr00t_n1d7: null
  # 25 = unitree_g1_full_body_with_waist_height_nav_cmd. Our action layout is
  # arms | right_hand | base_height | navigate(vx,vy,yaw_rate), which is the
  # same category order, so this slot still warm-starts the projector rows.
  embodiment_id: 25
  tune_llm: true
  tune_visual: true
  enable_gradient_checkpointing: true
  qwenvl:
    base_vlm: nvidia/Cosmos-Reason2-2B
    attn_implementation: sdpa
    select_layer: 16
  action_model:
    # left_arm7 + right_arm7 + hand_right6 + root_height1 + lin_vel_xy2 +
    # yaw_rate1 = 24 action dims; waist3 + left_arm7 + right_arm7 = 17 state.
    # UNCHANGED from the single-view recipe: the tipcrop dataset's state/action
    # parquets are byte-identical to the source, and its own meta/stats.json
    # reproduces the same degenerate-dim census.
    action_dim: 27
    state_dim: 17
    # 30, and NO LONGER == len(action_indices): round 4's DataConfig loads
    # 30 + MAX_LAG actions so VisionLagJitter has something to slide over,
    # then hands the head exactly 30 back. Changing MAX_LAG does not change
    # this number.
    action_horizon: 30
    # --- everything below matches nvidia/GR00T-N1.7-3B config.json and MUST NOT
    #     change if you want the pretrained head to keep loading 1:1 ---
    max_action_dim: 132
    max_state_dim: 132
    # ROUND 4: four state frames, matching the DataConfig's
    # state_indices [-36, -24, -12, 0] (0.6 s). This is the ONE architectural
    # change, and the reason the pretrained state_encoder needs widening.
    state_history_length: 4
    max_num_embodiments: 32
    backbone_embedding_dim: 2048
    input_embedding_dim: 1536
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    use_vlln: true
    use_alternate_vl_dit: true
    attend_text_every_n_blocks: 2
    num_inference_timesteps: 4
    num_timestep_buckets: 1000
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    # 0.8 -> 0.3. The old value was chosen to FORCE camera reliance, and it
    # succeeded: at 80% dropout the head spent most of training with no proprio
    # at all, which is coherent with serving --no_state but leaves nothing to
    # break the up/down tie. It cannot stay high here or the history is trained
    # away. It should not go to 0.0 either: joint angles alone predict the next
    # action well on a repetitive bench task, and a head that takes that
    # shortcut stops looking at the rack. 0.3 keeps vision load-bearing while
    # letting state be present on most steps.
    state_dropout_prob: 0.3
    # --- press-phase frame weighting (CosmosGR00T_N1d7._frame_weights) --------
    # OFF, deliberately. This run changes the VISION path; leaving the loss
    # identical to the single-view recipe is what makes the two comparable. If
    # the baseline under-presses the ejector, turn it on THEN — dim 18 ==
    # action.hand_right[4] == thumb_bend, and under min_max on 0..1000 a +0.04
    # threshold (raw > 520) flags 1.68% of frames.
    grasp_loss_weight: 1.0
    grasp_weight_dim: 18
    grasp_weight_thresh: 0.04
    diffusion_model_cfg:
      num_attention_heads: 32
      attention_head_dim: 48
      output_dim: 1024
      num_layers: 32
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
    vl_self_attention_cfg:
      num_attention_heads: 32
      attention_head_dim: 64
      num_layers: 4
      dropout: 0.2
      final_dropout: true
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    # TRUE: N1.7 is flow-matching and conditions on proprio.
    include_state: true
    data_root_dir: /home/jren313/Datasets
    data_mix: unitree_g1_pipette_tipcrop_train_waist_hist_n1d7
    # Serve-time camera-count contract == len(video_keys) of the DataConfig
    # (rgb, tip_crop, IN THAT ORDER). The framework logs a loud error if an eval
    # client sends a different count; without it the mismatch is silent.
    # See CosmosGR00T_N1d7._check_num_views.
    expected_num_views: 2
    lerobot_version: v2.0             # v2.1 layout reads fine via the v2.0 path
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 16         # x8 GPUs x accum 1 = global batch 128
    load_all_data_for_training: true
    obs_image_size: [256, 256]        # N1.7 image_target_size
    delete_pause_frame: false
    video_backend: decord
    num_workers: 4

trainer:
  max_train_steps: 10000              # ~22.6 epochs over 56,742 frames @ batch 128
  num_warmup_steps: 100
  save_interval: 2000                 # 9.5 GB per checkpoint — 5 + final = ~57 GB
  eval_interval: 500
  learning_rate:
    base: 2.0e-05
    qwen_vl_interface: 2.0e-05
    action_head: 2.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  # Informational only — real accum comes from ACCELERATE_GRADIENT_ACCUMULATION_STEPS
  # exported by the launcher (Accelerator is built at import time). Keep in sync.
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    # paged_adamw_8bit, as in the single-view recipe. The 8xB200 wristcam run
    # used plain adamw; on a 180 GB card either fits, and 8-bit states are what
    # make a local smoke test on a 16 GB card possible at all. Override with
    # --trainer.optimizer.name adamw to match that run exactly.
    name: paged_adamw_8bit
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  save_format: pt
