# ROUND 7 = round 6 with the TWO WRIST VIEWS AT 448 instead of 256.
#
# Round 6 fed all three views at 256. Measured on the stored frames, that
# leaves the green tip at 6x10 px in the ego view but only 1-3 px in each
# wrist view -- small enough that a blob detector cannot find it. Those two
# views are 4.2x downscales of a 1080x1080 crop and they are where tip
# alignment reads, so this run spends tokens there and nowhere else:
#
#   view          stored          model input
#   rgb           1280x720        256x256      64 tokens
#   wrist_left    1080x1080       448x448     196 tokens
#   wrist_right   1080x1080       448x448     196 tokens
#                                             456 total (round 6: 192)
#
# Measured VL encode on an RTX 4080 (bf16, select_layer=16): 44 ms against
# round 6's 24 ms. 20 ms on top of a ~56 ms action head, so the server keeps
# the 11-12 Hz it sustains today.
#
# Everything below is round 6 unchanged.
#
# ROUND 6 = round 4's action/state recipe on the THREE-CAMERA capture.
#
# WHAT THIS RUN IS. The 2026-08-19 rig replaced the manufactured tip_crop with
# two real 1920x1080 cameras beside the ego one. Both are stored centre-cropped
# to 1080x1080, so all three views reach the model as SQUARE downscales instead
# of a 1.78x horizontal squash. Everything about the action space, the state
# history and the optimiser is unchanged from round 4.
#
#   view          stored          at model input
#   rgb           1280x720        256x256
#   wrist_left    1080x1080       256x256
#   wrist_right   1080x1080       256x256
#
# 224 -> 256, AND IT IS NOT A COSMETIC CHANGE. The Cosmos processor floors the
# shortest edge at 65536 px (256x256), so a 224 frame was being upscaled back
# to 256 before tokenising: both spellings cost 64 tokens per view, and 224
# only added a resample that threw detail away. Worse, `_pack_sample` HARD-CODED
# 224 for training while the server already honoured obs_image_size (256), so
# every previous checkpoint -- round 5 included -- trains at 224 and serves at
# 256. Measured on a real frame the two preprocessing paths differ by 2.2% of
# the tensor's own standard deviation. datasets.py now reads obs_image_size in
# both places; this is the first run where train and serve agree.
#
# THREE VIEWS = 192 IMAGE TOKENS (3 x 64), up from 128. Measured VL-encode on
# an RTX 4080 (bf16, select_layer=16): 24 ms at 256, against 578 ms if the
# frames were fed at native resolution (4960 tokens) -- which is 1.6 Hz end to
# end and cannot drive a 60 Hz action loop.
#
# LANGUAGE IS CONSTANT AGAIN. This capture has no phase column, so
# annotation.human.task_description serves one sentence on every frame, as in
# rounds 1-4. Round 5's per-frame phase language does not apply here, and a
# checkpoint from this run must NOT be served through a phase lane.
#
# THE TIP IS GREEN in this capture and the task text says so. The 2026-08-13
# and 2026-08-17 captures used red tips.
#
# TWO THINGS TO WATCH.
#   1. NO EVAL SPLIT. All 53 episodes train; nothing is held out, so there is
#      no in-distribution score. Judge this run on the robot.
#   2. THE TIP IS 1-3 px IN THE WRIST VIEWS at 256 (it is 6x10 px in the ego
#      view). Those views are 4.2x downscales of a 1080x1080 crop, and the
#      centre crop is fixed while the content sits right of centre, so the tip
#      also leaves frame during parts of some episodes. If the policy cannot
#      find the tip, that is the first thing to revisit -- feeding the two
#      wrist views at 384 costs ~10 ms and roughly doubles it.
#
# DEPLOYMENT CONDITIONS from round 4 still travel with this checkpoint: serve
# WITHOUT --no_state (the head is built for a 4-frame state history) and run
# the robot at action_hz 60, because the policy is velocity-conditioned.
#
run_id: starvla_gr00t_n1d7_pipette_3view_mixres
run_root_dir: outputs/starvla
seed: 42
wandb_entity: jren313-georgia-institute-of-technology
wandb_project: starVLA_unitree_g1_pipette
is_debug: false
version_id: "0.1"

framework:
  name: CosmosGR00TN1d7
  # N1.7 checkpoint dir (contains model-*.safetensors). Leave null to auto-find
  # the snapshot in the HF cache (models--nvidia--GR00T-N1.7-3B).
  pretrained_gr00t_n1d7: null
  # 25 = unitree_g1_full_body_with_waist_height_nav_cmd. Our action layout is
  # arms | right_hand | base_height | navigate(vx,vy,yaw_rate), which is the
  # same category order, so this slot still warm-starts the projector rows.
  embodiment_id: 25
  tune_llm: true
  tune_visual: true
  enable_gradient_checkpointing: true
  qwenvl:
    base_vlm: nvidia/Cosmos-Reason2-2B
    attn_implementation: sdpa
    select_layer: 16
  action_model:
    # left_arm7 + right_arm7 + hand_right6 + root_height1 + lin_vel_xy2 +
    # yaw_rate1 = 24 action dims; waist3 + left_arm7 + right_arm7 = 17 state.
    # UNCHANGED from the single-view recipe: the tipcrop dataset's state/action
    # parquets are byte-identical to the source, and its own meta/stats.json
    # reproduces the same degenerate-dim census.
    action_dim: 27
    state_dim: 17
    # 30, and NO LONGER == len(action_indices): round 4's DataConfig loads
    # 30 + MAX_LAG actions so VisionLagJitter has something to slide over,
    # then hands the head exactly 30 back. Changing MAX_LAG does not change
    # this number.
    action_horizon: 30
    # --- everything below matches nvidia/GR00T-N1.7-3B config.json and MUST NOT
    #     change if you want the pretrained head to keep loading 1:1 ---
    max_action_dim: 132
    max_state_dim: 132
    # ROUND 4: four state frames, matching the DataConfig's
    # state_indices [-36, -24, -12, 0] (0.6 s). This is the ONE architectural
    # change, and the reason the pretrained state_encoder needs widening.
    state_history_length: 4
    max_num_embodiments: 32
    backbone_embedding_dim: 2048
    input_embedding_dim: 1536
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    use_vlln: true
    use_alternate_vl_dit: true
    attend_text_every_n_blocks: 2
    num_inference_timesteps: 4
    num_timestep_buckets: 1000
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    # 0.8 -> 0.3. The old value was chosen to FORCE camera reliance, and it
    # succeeded: at 80% dropout the head spent most of training with no proprio
    # at all, which is coherent with serving --no_state but leaves nothing to
    # break the up/down tie. It cannot stay high here or the history is trained
    # away. It should not go to 0.0 either: joint angles alone predict the next
    # action well on a repetitive bench task, and a head that takes that
    # shortcut stops looking at the rack. 0.3 keeps vision load-bearing while
    # letting state be present on most steps.
    state_dropout_prob: 0.3
    # --- press-phase frame weighting (CosmosGR00T_N1d7._frame_weights) --------
    # OFF, deliberately. This run changes the VISION path; leaving the loss
    # identical to the single-view recipe is what makes the two comparable. If
    # the baseline under-presses the ejector, turn it on THEN — dim 18 ==
    # action.hand_right[4] == thumb_bend, and under min_max on 0..1000 a +0.04
    # threshold (raw > 520) flags 1.68% of frames.
    grasp_loss_weight: 1.0
    grasp_weight_dim: 18
    grasp_weight_thresh: 0.04
    diffusion_model_cfg:
      num_attention_heads: 32
      attention_head_dim: 48
      output_dim: 1024
      num_layers: 32
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
    vl_self_attention_cfg:
      num_attention_heads: 32
      attention_head_dim: 64
      num_layers: 4
      dropout: 0.2
      final_dropout: true
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    # TRUE: N1.7 is flow-matching and conditions on proprio.
    include_state: true
    data_root_dir: /home/jren313/Datasets
    data_mix: unitree_g1_pipette_3view_mixres_n1d7_mix
    # Serve-time camera-count contract == len(video_keys) of the DataConfig
    # (rgb, tip_crop, IN THAT ORDER). The framework logs a loud error if an eval
    # client sends a different count; without it the mismatch is silent.
    # See CosmosGR00T_N1d7._check_num_views.
    expected_num_views: 3
    lerobot_version: v2.0             # v2.1 layout reads fine via the v2.0 path
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 16         # x8 GPUs x accum 1 = global batch 128
    load_all_data_for_training: true
    # PER-VIEW sizes, in the DataConfig's video_keys order
    # (rgb, wrist_left, wrist_right). Read by BOTH the loader's _pack_sample
    # and the server's predict_action; they must agree or the head is served
    # views at a scale it never trained on. Must also match
    # Pipette3ViewMixResG1GR00TN1d7DataConfig.view_resize_overrides.
    obs_image_size: [[256, 256], [448, 448], [448, 448]]
    delete_pause_frame: false
    video_backend: decord
    num_workers: 4

trainer:
  max_train_steps: 10000              # ~18.5 epochs over 69,148 frames @ batch 128
  num_warmup_steps: 100
  save_interval: 2000                 # 9.5 GB per checkpoint — 5 + final = ~57 GB
  eval_interval: 500
  learning_rate:
    base: 2.0e-05
    qwen_vl_interface: 2.0e-05
    action_head: 2.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  # Informational only — real accum comes from ACCELERATE_GRADIENT_ACCUMULATION_STEPS
  # exported by the launcher (Accelerator is built at import time). Keep in sync.
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    # paged_adamw_8bit, as in the single-view recipe. The 8xB200 wristcam run
    # used plain adamw; on a 180 GB card either fits, and 8-bit states are what
    # make a local smoke test on a 16 GB card possible at all. Override with
    # --trainer.optimizer.name adamw to match that run exactly.
    name: paged_adamw_8bit
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  save_format: pt
