# GR00T-N1.7 FIVE-STEP v2 (2026-10-01): ONE policy on ALL FIVE steps of the
# five-step capture (pipette pick -> tube pick -> aim -> tube return -> pipette
# return), each step's goal sentence as the language input, trained with the
# PER-PHASE RECIPE v2 the per-phase runs used one step at a time: pick round 3's
# recipe (wrists chunk-relative, right hand ABSOLUTE registers, + 14 ABSOLUTE arm
# joints = the bridge IK's warm start; GR00T-N1.7, state dropout 0.8, 59-dim
# state, 2 views, 1 mm pause filter, LRs, warmup 100, cosine, batch 128, 10
# epochs) with the LEFT THUMB CHUNK-RELATIVE (DataConfig
# unitree_g1_pipette_2view_wrist12rel_lthumbrel_joint14).
#
# THE QUESTION: does one policy on the pooled data beat the five per-phase
# policies? 10 epochs over the union = 10 epochs of every phase (as in its own
# run) plus the other four. Versus round 10's five-step GR00T twin (same data
# and split): this action space (right hand absolute, + joints, 32 dims) and
# recipe instead of round 10's 18-dim both-hands-relative one.
#
# DATA: round 10's recording-level split, all five steps: 202 / 35 episodes (the
# union of the five per-phase splits); 138,642 / 23,981 frames. Dirs
# g1-pipette-2view-5task-wrist12rel-lthumbrel-joint14-{train,eval}; own
# statistics over the 202 train episodes, byte-copied into the eval dir.
#
# Score per phase afterwards on each per-phase run's own 480 held-out samples
# (unitree_g1_pipette_2view_p{1..5}_wrist12rel_lthumbrel_joint14_5taskstats_eval_mix)
# in physical units against the true labels; this run's mse / ratio compare
# with nothing else.
#
run_id: starvla_gr00t_n1d7_pipette_2view_5task_wrist12rel_lthumbrel_joint14_sd08
run_root_dir: outputs/starvla
seed: 42
wandb_entity: jren313-georgia-institute-of-technology
wandb_project: starVLA_unitree_g1_pipette
is_debug: false
version_id: "0.1"
framework:
  name: CosmosGR00TN1d7
  # N1.7 checkpoint dir (contains model-*.safetensors). Leave null to auto-find
  # the snapshot in the HF cache (models--nvidia--GR00T-N1.7-3B).
  pretrained_gr00t_n1d7: null
  # 25 = unitree_g1_full_body_with_waist_height_nav_cmd, as the round-10 twin:
  # the slot only selects which pretrained projector rows warm-start.
  embodiment_id: 25
  tune_llm: true
  tune_visual: true
  enable_gradient_checkpointing: true
  qwenvl:
    base_vlm: nvidia/Cosmos-Reason2-2B
    attn_implementation: sdpa
    select_layer: 16
  action_model:
    # 32 = L/R wrist rel6 + L thumb_bend REL + R pinky..thumb_bend abs + L/R
    # arm joints 7 + 7, absolute (see the DataConfig); 59 = 29 joints +
    # measured and commanded L/R wrist pose6 + commanded L hand1 / R hand5.
    action_dim: 32
    state_dim: 59
    action_horizon: 30
    # --- everything below matches nvidia/GR00T-N1.7-3B config.json and MUST NOT
    #     change if you want the pretrained head to keep loading 1:1 ---
    max_action_dim: 132
    max_state_dim: 132
    # ONE state frame; MUST match the DataConfig's state_indices [0].
    state_history_length: 1
    max_num_embodiments: 32
    backbone_embedding_dim: 2048
    input_embedding_dim: 1536
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    use_vlln: true
    use_alternate_vl_dit: true
    attend_text_every_n_blocks: 2
    num_inference_timesteps: 4
    num_timestep_buckets: 1000
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    # The round-10 twin's value: the 59-dim state is zeroed on 80% of
    # samples, so the head has to read the cameras, hand targets included.
    state_dropout_prob: 0.8
    # 1.0 == press-frame weighting DISABLED (the dim/thresh below are inert;
    # dim 18 is now the left shoulder pitch, which nothing weights).
    grasp_loss_weight: 1.0
    grasp_weight_dim: 18
    grasp_weight_thresh: 0.04
    diffusion_model_cfg:
      num_attention_heads: 32
      attention_head_dim: 48
      output_dim: 1024
      num_layers: 32
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
    vl_self_attention_cfg:
      num_attention_heads: 32
      attention_head_dim: 64
      num_layers: 4
      dropout: 0.2
      final_dropout: true
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /home/jren313/Datasets
    data_mix: unitree_g1_pipette_2view_5task_wrist12rel_lthumbrel_joint14_train_mix
    eval_data_mix: unitree_g1_pipette_2view_5task_wrist12rel_lthumbrel_joint14_eval_mix
    # 8 ranks x 10 x 12 = 960 fixed holdout samples drawn (length-weighted)
    # from all 35 held-out episodes, every step: indices [0, 960) of the eval
    # mixture. Checkpoint selection only; the per-phase comparison is scored
    # afterwards on each phase's own [0, 480) (the *_5taskstats_eval_mix).
    eval_num_batches: 10
    eval_batch_size: 12
    # Repeats each sample's row 0: zero on the rel wrist / left-thumb dims, the
    # current right-hand / joint command on the absolute dims -- "hold still".
    eval_baseline: hold_first
    expected_num_views: 2
    lerobot_version: v2.0
    action_type: abs_qpos
    # rel on the two WRISTS and the LEFT THUMB, each anchored at its commanded
    # state alias (byte-copy columns); dims [3, 6) of the wrists get the exact
    # relative rotation. The right hand and the joints are left out on
    # purpose: absolute labels AND statistics.
    action_mode: rel
    action_mode_apply_keys: ["action.left_wrist_rel6", "action.right_wrist_rel6",
                             "action.left_hand_rel"]
    action_mode_state_map:
      action.left_wrist_rel6: state.left_wrist_cmd6
      action.right_wrist_rel6: state.right_wrist_cmd6
      action.left_hand_rel: state.left_hand_cmd
    action_mode_rotvec_dims:
      action.left_wrist_rel6: [3, 6]
      action.right_wrist_rel6: [3, 6]
    # 1.0 mm over the chunk on the commanded L xyz ++ R xyz. TRAIN MIXTURE ONLY.
    pause_filter_mm: 1.0
    pause_filter_key: action.both_wrist_xyz
    sequential_step_sampling: false
    # 16 x 8 GPUs (node 3), no accumulation = 128, the per-phase runs' batch.
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    delete_pause_frame: false
    video_backend: decord
    num_workers: 8

trainer:
  # 10 epochs at batch 128 over the 137,741 post-pause-filter train anchors:
  # 1076.1 steps/epoch x 10 = 10761. Every phase is seen as often as in
  # its own run (10 epochs), plus the other four phases.
  max_train_steps: 10761
  num_warmup_steps: 100
  # Eval every 900 steps (~0.84 epoch); save every SECOND eval point
  # + final_model (9.5 GB each): 5 saves + final = ~57 GB on node 3's disk.
  save_interval: 1800
  eval_interval: 900
  learning_rate:
    base: 2.0e-05
    qwen_vl_interface: 2.0e-05
    action_head: 2.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  # Informational only — real accum comes from ACCELERATE_GRADIENT_ACCUMULATION_STEPS
  # exported by the launcher (Accelerator is built at import time). Keep in sync.
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: paged_adamw_8bit
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  save_format: pt
