# QwenOFT PIPETTE PICK, ROUND 1 (2026-09-28): phase 1 of the five-step bench
# ("Pick up the pipette from the holder on the right with the right hand.")
# trained ALONE, to test one phase in isolation before the five-phase model.
#
# SAME RECIPE AS THE FIVE-STEP MODEL (starvla_qwenoft_pipette_2view_5task_
# wrist18rel_state.yaml): 18-D bimanual chunk-relative action (L/R wrist rel6
# anchored at the COMMANDED pose, exact relative rotation, L thumb_bend + R
# pinky..thumb_bend register deltas), 59-D state, two plain-resized views at
# 256 (no centre crops), 30-row horizon, pause filter on the both-wrist
# 6-vector, 21 x accum 2 x 3 GPUs = 126, same learning rates and cosine
# schedule, same augmentation, L1 head.  The action/state spaces are kept
# bimanual so the checkpoint serves on the five-step lane unchanged.
#
# WHAT DIFFERS:
#   1. DATA: step-1 episodes only.  The five-step model's recording-level
#      split restricted to step 1 -- 54 train (36,766 frames) / 9 test
#      episodes (6,085 frames: eps 10 12 32 40 68 78 82 102 118, 5 + 4 from
#      the two sessions).  The five-step model never trained on the 9 test
#      episodes either, so both can be scored on them.
#   2. STATISTICS over the 54 train episodes (copied into the test dir).  The
#      left thumb_bend delta is identically zero in step 1 (zero span): the
#      q99 normaliser masks it, so it is served as 0 = held at the anchor.
#      Right-finger delta spans cover the full grasp closure (~1090 reg).
#   3. STEP BUDGET: 10 epochs, as before: 36,558 post-pause-filter anchors x
#      10 / 126 = 2,901 -> 2,900.  Warmup scaled with it (600 of 10,900 ->
#      160 of 2,900, the same 5.5%).  Save every 500 and evaluate every 250
#      (monitoring only; the five-step run's best step fell between saves).
#
# Holdout eval: 3 ranks x 10 x 16 = 480 fixed samples from the 9 test
# episodes, hold_first baseline.
#
run_id: starvla_qwenoft_pipette_pick_r1_2view_wrist18rel_state
run_root_dir: outputs/starvla
seed: 42
wandb_entity: jren313-georgia-institute-of-technology
wandb_project: starVLA_unitree_g1_pipette
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: /data/jren313/models/Qwen3-VL-4B-Instruct
    attn_implementation: sdpa
    enable_gradient_checkpointing: true
  action_model:
    action_model_type: MLP
    # == Pipette2ViewOFTWrist18RelDataConfig.action_key_dims: L rel6 + R rel6 + L hand1 + R hand5
    action_dim: 18
    # == sum(state_key_dims): 29 joints + 12 measured pose + 12 commanded pose + 6 commanded hand
    state_dim: 59
    action_horizon: 30
    action_hidden_dim: 2560

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /home/jren313/Datasets
    data_mix: unitree_g1_pipette_2view_p1_wrist18rel_train_mix
    eval_data_mix: unitree_g1_pipette_2view_p1_wrist18rel_eval_mix
    # 3 ranks x 10 x 16 = 480 fixed holdout samples from the 9 held-out
    # step-1 episodes.
    eval_num_batches: 10
    eval_batch_size: 16
    # Row 0 of every rel label is identically zero (both poses AND hands), so
    # repeating it is the physical hold-still baseline.
    eval_baseline: hold_first
    expected_num_views: 2
    lerobot_version: v2.0
    action_type: abs_qpos
    # The action-space change. Both keys are anchored at their COMMANDED
    # state alias (byte-copy columns, see the header); the pose key's dims
    # [3, 6) are a rotation vector and get the exact relative rotation.
    action_mode: rel
    action_mode_apply_keys: ["action.left_wrist_rel6", "action.right_wrist_rel6",
                             "action.left_hand_rel", "action.right_hand_rel"]
    action_mode_state_map:
      action.left_wrist_rel6: state.left_wrist_cmd6
      action.right_wrist_rel6: state.right_wrist_cmd6
      action.left_hand_rel: state.left_hand_cmd
      action.right_hand_rel: state.right_hand_cmd
    action_mode_rotvec_dims:
      action.left_wrist_rel6: [3, 6]
      action.right_wrist_rel6: [3, 6]
    # 1.0 mm on the commanded wrist xyz (alias [0:3] of the pose column) --
    # round 8's gate on the same physical quantity. TRAIN MIXTURE ONLY.
    pause_filter_mm: 1.0
    pause_filter_key: action.both_wrist_xyz
    sequential_step_sampling: false
    # 21 x accum 2 x 3 GPUs = 126, rounds 8/9's pair.
    per_device_batch_size: 21
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    delete_pause_frame: false
    video_backend: decord
    num_workers: 8

trainer:
  # 10 epochs at batch 126 over the post-pause-filter TRAIN anchors, measured
  # by scratchpad build_5task_p1_split.py: 36558 anchors (36766 frames, 54
  # episodes) / 126 = 290.1 steps/epoch, x10 = 2901 -> 2900.
  max_train_steps: 2900
  num_warmup_steps: 160
  save_interval: 500
  eval_interval: 250
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_format: pt
