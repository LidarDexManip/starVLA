# GR00T-N1.7 fine-tune for the LONG-HORIZON G1 + Inspire piston task, with
# THREE camera streams (ego + left wrist + right wrist) into the VLM backbone.
#
# Differences from starvla_gr00t_n1d7_piston.yaml:
#   - data_mix           unitree_g1_piston_wristcam_n1d7  (3 video keys)
#   - expected_num_views 3      (serve-time camera-count contract)
#   - grasp_loss_weight  3.0    (press-phase weighting; valid here because this
#                                dataset's action dim 25 spans q01=-0.10..q99=0.25)
#   - per_device_batch_size 4 / accum 8   (3 views ~= 3x the image tokens)
# Training starts from the OFFICIAL nvidia/GR00T-N1.7-3B weights, not from a
# previous starVLA run: pass PRETRAINED_N1D7 (or let it auto-find the HF cache)
# and leave PRETRAINED_CHECKPOINT empty.
#
# Framework CosmosGR00TN1d7 = a starVLA-native reproduction of NVIDIA
# GR00T-N1.7 that DIRECTLY LOADS the public nvidia/GR00T-N1.7-3B parameters:
#   - Backbone : Cosmos-Reason2-2B (Qwen3-VL), LLM truncated to select_layer=16
#   - Head     : 32-layer alternate-VL flow-matching DiT + 4-layer VL
#                self-attention + VL LayerNorm + multi-embodiment projectors.
# All 1031 checkpoint tensors load 1:1 (verified). Fine-tuning then adapts the
# G1 embodiment slot (id 25) and, by default, the whole stack to the piston task.
#
# Run via run_starvla_GR00T_N1d7_piston_train.sh (PLAIN accelerate, NO DeepSpeed).
# Unlike QwenOFT, this policy is flow-matching and CONDITIONS ON STATE, so
# include_state is TRUE here.

run_id: starvla_gr00t_n1d7_piston_wristcam
run_root_dir: outputs/starvla
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_unitree_g1_piston
is_debug: false
version_id: "0.1"

framework:
  name: CosmosGR00TN1d7
  # N1.7 checkpoint dir (contains model-*.safetensors). Leave null to auto-find
  # the snapshot in the HF cache (models--nvidia--GR00T-N1.7-3B). Override via
  # the launcher to a local path.
  pretrained_gr00t_n1d7: null
  # Pretrained embodiment slot to fine-tune. 25 = unitree_g1_full_body_with_
  # waist_height_nav_cmd, whose action layout (arms|hands|base_height|nav)
  # matches the piston robot — warm-starts the category-specific projectors.
  embodiment_id: 25
  # Full fine-tune of the backbone by default (as in N1.7 training: tune_llm=
  # tune_visual=true). Set BOTH to false for a memory-light "freeze VLM, train
  # head only" run (the VL features are then detached).
  tune_llm: true
  tune_visual: true
  enable_gradient_checkpointing: true
  qwenvl:
    base_vlm: nvidia/Cosmos-Reason2-2B
    attn_implementation: sdpa
    select_layer: 16
  action_model:
    # Real (unpadded) robot dims. left_arm7+right_arm7+left_hand6+right_hand6+
    # base_height1+navigate3 = 30 action dims; 29-dim upper-body state.
    action_dim: 30
    state_dim: 29
    action_horizon: 30   # == len(action_indices) in the N1.7 DataConfig
    # --- everything below matches nvidia/GR00T-N1.7-3B config.json and MUST NOT
    #     change if you want the pretrained head to keep loading 1:1 ---
    max_action_dim: 132
    max_state_dim: 132
    state_history_length: 1
    max_num_embodiments: 32
    backbone_embedding_dim: 2048
    input_embedding_dim: 1536
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    use_vlln: true
    use_alternate_vl_dit: true
    attend_text_every_n_blocks: 2
    num_inference_timesteps: 4
    num_timestep_buckets: 1000
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    state_dropout_prob: 0.8   # state available but dropped 80% of the time -> strong camera reliance
    # --- press-phase frame weighting (see CosmosGR00T_N1d7._frame_weights) ---
    # The plunger press is short, so a uniform loss averages it away. Frames whose
    # right-hand thumb channel (dim 25 == action.right_hand[5]) is lifted off rest
    # get `grasp_loss_weight` on all action dims; the head's mask-normalised loss
    # turns that into the weighted mean  L = Sum(w*err) / Sum(w).
    #
    # Verified against this dataset's meta/stats.json: q01=-0.10, q99=+0.25, so
    # the -0.143 threshold is exactly raw > 0.05 and flags ~21% of frames. Do NOT
    # copy this value onto `unitree_g1_piston_pnp_n1d7`, where dim 25 is constant
    # (q01 == q99, StateActionTransform passes it through un-normalised) and the
    # threshold would flag 100% of frames -- a silent no-op.
    grasp_loss_weight: 3.0
    grasp_weight_dim: 25
    # normalised: 2*(0.05 - q01)/(q99 - q01) - 1 with q01=-0.10, q99=0.25 -> -0.1429
    # i.e. raw thumb > 0.05, lifted from its -0.1 rest.
    grasp_weight_thresh: -0.143
    diffusion_model_cfg:
      num_attention_heads: 32
      attention_head_dim: 48
      output_dim: 1024
      num_layers: 32
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
    vl_self_attention_cfg:
      num_attention_heads: 32
      attention_head_dim: 64
      num_layers: 4
      dropout: 0.2
      final_dropout: true
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    # TRUE on purpose: N1.7 is a flow-matching policy that conditions on proprio.
    include_state: true
    data_root_dir: /home/jren313/Datasets
    data_mix: unitree_g1_piston_wristcam_n1d7
    # Serve-time camera-count contract == len(video_keys) of the DataConfig above
    # (ego_view, left_wrist_view, right_wrist_view, IN THAT ORDER). The framework
    # logs a loud error if an eval client sends a different count; without it the
    # mismatch is silent. See CosmosGR00T_N1d7._check_num_views.
    expected_num_views: 3
    lerobot_version: v2.0             # v2.1 layout reads fine via the v2.0 path
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    # 3 views ~= 192 image tokens/sample vs 64, so halve the micro-batch and
    # double accum to keep the effective batch at 32.
    per_device_batch_size: 4
    load_all_data_for_training: true
    # Cosmetic only: LeRobotSingleDataset._pack_sample resizes every view to
    # 224x224, and the Cosmos processor's shortest_edge (65536 px) floor lifts
    # both 224 and 256 to the same 16x16 patch grid (64 tokens/view). Kept at the
    # N1.7 image_target_size so train and serve stay on the same code path.
    obs_image_size: [256, 256]
    delete_pause_frame: false
    video_backend: decord
    num_workers: 4

trainer:
  max_train_steps: 10000
  num_warmup_steps: 50
  save_interval: 1000
  eval_interval: 500
  # Per-module LRs: lower for the pretrained Cosmos backbone, higher for the
  # flow-matching head (which is adapting to a new embodiment + normalization).
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_head: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  # Informational only — real accum comes from ACCELERATE_GRADIENT_ACCUMULATION_STEPS
  # exported by the launcher (Accelerator is built at import time). Keep in sync.
  gradient_accumulation_steps: 8
  gradient_checkpointing: true

  optimizer:
    # 8-bit paged AdamW: the only way a 3.1B full fine-tune fits without ZeRO.
    # On a 24GB card, prefer freezing the backbone (tune_llm/tune_visual false)
    # AND/OR per_device_batch_size 1; the 96GB card fits the full fine-tune.
    name: paged_adamw_8bit
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  save_format: pt
