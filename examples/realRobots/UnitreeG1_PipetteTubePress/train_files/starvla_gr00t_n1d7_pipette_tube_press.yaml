# GR00T-N1.7 imitation learning on RFT's scripted pipette/tube trajectories.
# Dataset: LeRobot v2.1, 30 Hz, 4 RGB views, 54-D state and absolute qpos action.

run_id: starvla_gr00t_n1d7_pipette_tube_press
run_root_dir: outputs/starvla
seed: 42
wandb_entity: geertswon-georgia-institute-of-technology
wandb_project: starVLA_unitree_g1_pipette_tube_press
is_debug: false
version_id: "0.1"

framework:
  name: CosmosGR00TN1d7
  pretrained_gr00t_n1d7: null
  # The 54-D simulator control space is larger than the public 30-D G1 action,
  # but arms-first packing preserves the pretrained slot's first 14 arm dims.
  embodiment_id: 25
  tune_llm: false
  tune_visual: false
  enable_gradient_checkpointing: true
  qwenvl:
    base_vlm: playground/Pretrained_models/Cosmos-Reason2-2B
    attn_implementation: sdpa
    select_layer: 16
  action_model:
    action_dim: 54
    state_dim: 54
    action_horizon: 30
    max_action_dim: 132
    max_state_dim: 132
    state_history_length: 1
    max_num_embodiments: 32
    backbone_embedding_dim: 2048
    input_embedding_dim: 1536
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    use_vlln: true
    use_alternate_vl_dit: true
    attend_text_every_n_blocks: 2
    num_inference_timesteps: 4
    num_timestep_buckets: 1000
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    # Keep proprioception reliable for coordinated 40-DoF hand control while
    # still preventing a purely open-loop state replay policy.
    state_dropout_prob: 0.2
    # Baseline is unweighted.  Dim 36 is right_thumb_mcp in model order and can
    # be used for press-phase weighting after statistics are measured.
    grasp_loss_weight: 1.0
    grasp_weight_dim: 36
    grasp_weight_thresh: 0.0
    diffusion_model_cfg:
      num_attention_heads: 32
      attention_head_dim: 48
      output_dim: 1024
      num_layers: 32
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
    vl_self_attention_cfg:
      num_attention_heads: 32
      attention_head_dim: 64
      num_layers: 4
      dropout: 0.2
      final_dropout: true
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /coc/flash12/jwang3617/robot/RFT/vega_wuji_isaac6/outputs
    data_mix: unitree_g1_pipette_tube_press_n1d7
    # StarVLA's v2.0 reader is the compatibility path for LeRobot v2.1 layout.
    lerobot_version: v2.0
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 1
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    expected_num_views: 4
    delete_pause_frame: false
    video_backend: decord
    num_workers: 4

trainer:
  max_train_steps: 3000
  num_warmup_steps: 50
  save_interval: 500
  eval_interval: 250
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_head: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  optimizer:
    name: paged_adamw_8bit
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_format: pt
